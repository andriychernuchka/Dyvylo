<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ДИВИЛО UI Component — User Community Review Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>

:root {
  --bg-page: #08080a;
  --bg-surface: #0f0f13;
  --bg-elevated: #15151b;
  --bg-card: #121217;
  --bg-card-hover: #181822;
  --bg-input: #0a0a0e;
  --bg-hover: #1c1c25;
  --bg-glass: rgba(15, 15, 19, 0.88);
  --bg-overlay: rgba(5, 5, 8, 0.82);

  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-main: rgba(255, 255, 255, 0.12);
  --border-hover: rgba(255, 255, 255, 0.24);
  --border-focus: #3b82f6;
  --border-divider: rgba(255, 255, 255, 0.05);

  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --text-inverse: #030305;
  --text-accent: #60a5fa;

  --accent-primary: #3b82f6;
  --accent-hover: #2563eb;
  --accent-dim: rgba(59, 130, 246, 0.12);
  --accent-border: rgba(59, 130, 246, 0.35);
  --accent-glow: rgba(59, 130, 246, 0.25);
  --accent-secondary: #8b5cf6;

  --status-live: #22c55e;
  --status-live-dim: rgba(34, 197, 94, 0.12);
  --status-live-border: rgba(34, 197, 94, 0.35);
  --status-warning: #eab308;
  --status-warning-dim: rgba(234, 179, 8, 0.12);
  --status-danger: #ef4444;
  --status-danger-dim: rgba(239, 68, 68, 0.12);
  --status-info: #06b6d4;
  --status-info-dim: rgba(6, 182, 212, 0.12);

  --radius-xs: 1px;
  --radius-sm: 2px;
  --radius: 2px;
  --radius-md: 3px;
  --radius-lg: 4px;
  --radius-pill: 9999px;

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.7);
  --shadow-glow: 0 0 24px rgba(59, 130, 246, 0.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg-page);
  color: var(--text-main);
  font-family: var(--font-sans);
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.component-frame {
  width: 100%;
  max-width: 1200px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.frame-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 8px;
  display: flex;
  justify-content: space-between;
}

/**
 * DYVYLO DESIGN SYSTEM - COMPONENTS
 * Standardized components ready for high-fidelity rendering and Figma import.
 */

/* ==========================================================================
   1. BUTTONS & ACTIONS
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-sans);
  font-size: var(--font-size-sm);
  font-weight: 600;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
  border-radius: var(--radius);
  border: 1px solid transparent;
  padding: 8px 14px;
  white-space: nowrap;
  transition: all var(--transition-fast);
  user-select: none;
}

.btn svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

/* Primary Cobalt Button */
.btn-primary {
  background-color: var(--accent-primary);
  border-color: var(--accent-primary);
  color: #ffffff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}

.btn-primary:hover {
  background-color: var(--accent-hover);
  border-color: var(--accent-hover);
  box-shadow: var(--shadow-glow);
}

.btn-primary:active {
  transform: translateY(1px);
}

/* Secondary Button */
.btn-secondary {
  background-color: var(--bg-surface);
  border-color: var(--border-main);
  color: var(--text-main);
}

.btn-secondary:hover {
  background-color: var(--bg-hover);
  border-color: var(--border-hover);
  color: #ffffff;
}

/* Outline Minimal Button */
.btn-outline {
  background-color: transparent;
  border-color: var(--border-main);
  color: var(--text-muted);
}

.btn-outline:hover {
  background-color: rgba(255, 255, 255, 0.04);
  border-color: var(--border-hover);
  color: var(--text-main);
}

/* Ghost Button */
.btn-ghost {
  background-color: transparent;
  border-color: transparent;
  color: var(--text-muted);
}

.btn-ghost:hover {
  background-color: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
}

/* Danger Button */
.btn-danger {
  background-color: var(--status-danger-dim);
  border-color: var(--status-danger-border);
  color: #fca5a5;
}

.btn-danger:hover {
  background-color: var(--status-danger);
  border-color: var(--status-danger);
  color: #ffffff;
}

/* Button Sizes */
.btn-xs {
  padding: 4px 8px;
  font-size: var(--font-size-2xs);
  gap: 4px;
}

.btn-sm {
  padding: 6px 10px;
  font-size: var(--font-size-xs);
  gap: 6px;
}

.btn-md {
  padding: 8px 14px;
  font-size: var(--font-size-sm);
}

.btn-lg {
  padding: 12px 22px;
  font-size: var(--font-size-base);
  font-weight: 700;
  gap: 10px;
}

.btn-icon {
  padding: 8px;
  width: 34px;
  height: 34px;
}

.btn-icon.btn-sm {
  width: 28px;
  height: 28px;
  padding: 6px;
}

.btn:disabled,
.btn.disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}


/* ==========================================================================
   2. BADGES, CHIPS & STATUS INDICATORS
   ========================================================================== */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: var(--font-size-2xs);
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  line-height: 1.2;
}

.badge-primary {
  background: var(--accent-dim);
  border-color: var(--accent-border);
  color: var(--text-accent);
}

.badge-rating {
  background: rgba(234, 179, 8, 0.12);
  border-color: rgba(234, 179, 8, 0.35);
  color: #facc15;
  font-weight: 700;
}

.badge-live {
  background: var(--status-live-dim);
  border-color: var(--status-live-border);
  color: var(--status-live);
}

.badge-danger {
  background: var(--status-danger-dim);
  border-color: var(--status-danger-border);
  color: #f87171;
}

.badge-info {
  background: var(--status-info-dim);
  border-color: rgba(6, 182, 212, 0.35);
  color: #22d3ee;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}

.status-dot-live {
  background: var(--status-live);
  box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
}

.status-dot-warn {
  background: var(--status-warning);
}

.status-dot-offline {
  background: var(--text-dim);
}

/* Filter Tag / Interactive Chip */
.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border-main);
  border-radius: var(--radius);
  color: var(--text-main);
  font-size: var(--font-size-xs);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.filter-chip:hover,
.filter-chip.active {
  background: var(--bg-elevated);
  border-color: var(--accent-primary);
  color: #ffffff;
}

.filter-chip .chip-remove {
  color: var(--text-dim);
  cursor: pointer;
}

.filter-chip .chip-remove:hover {
  color: #ffffff;
}


/* ==========================================================================
   3. FORM INPUTS & SELECTION CONTROLS
   ========================================================================== */

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.form-label {
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-family: var(--font-mono);
}

.form-hint {
  font-size: var(--font-size-xs);
  color: var(--text-dim);
}

.input-text,
.select-custom {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border-main);
  border-radius: var(--radius);
  color: var(--text-main);
  padding: 9px 12px;
  font-family: inherit;
  font-size: var(--font-size-sm);
  outline: none;
  transition: border-color var(--transition-fast), background var(--transition-fast);
}

.input-text:focus,
.select-custom:focus {
  border-color: var(--border-focus);
  background: var(--bg-surface);
}

.input-text::placeholder {
  color: var(--text-dim);
}

/* Quick Search Input with Shortcut */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border-main);
  border-radius: var(--radius);
  padding: 6px 10px;
  color: var(--text-dim);
  transition: border-color var(--transition-fast), width var(--transition);
}

.search-bar:focus-within {
  border-color: var(--border-focus);
}

.search-bar input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-main);
  font-size: var(--font-size-sm);
  font-family: inherit;
  width: 100%;
}

.search-shortcut {
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 2px 5px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xs);
  color: var(--text-dim);
  line-height: 1;
}

/* Checkbox */
.checkbox-wrap {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  font-size: var(--font-size-sm);
  color: var(--text-muted);
}

.checkbox-wrap input[type="checkbox"] {
  appearance: none;
  width: 16px;
  height: 16px;
  background: var(--bg-input);
  border: 1px solid var(--border-main);
  border-radius: var(--radius-xs);
  cursor: pointer;
  position: relative;
  transition: all var(--transition-fast);
}

.checkbox-wrap input[type="checkbox"]:checked {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
}

.checkbox-wrap input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 5px;
  width: 4px;
  height: 8px;
  border: solid #ffffff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* Toggle Switch */
.toggle-switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  font-size: var(--font-size-sm);
  color: var(--text-muted);
}

.toggle-switch input {
  opacity: 0;
  width: 0;
  height: 0;
  position: absolute;
}

.toggle-slider {
  width: 36px;
  height: 20px;
  background: #1c1c24;
  border: 1px solid var(--border-main);
  border-radius: 10px;
  position: relative;
  transition: background var(--transition-fast);
}

.toggle-slider::before {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  background: #ffffff;
  border-radius: 50%;
  transition: transform var(--transition-fast);
}

.toggle-switch input:checked + .toggle-slider {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
}

.toggle-switch input:checked + .toggle-slider::before {
  transform: translateX(16px);
}


/* ==========================================================================
   4. CARDS & MEDIA PREVIEWS
   ========================================================================== */

/* Vertical Poster Card */
.card-poster {
  display: flex;
  flex-direction: column;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
  position: relative;
}

.card-poster:hover {
  transform: translateY(-3px);
  border-color: var(--border-hover);
  box-shadow: var(--shadow-md);
}

.card-poster-thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  background: #111116;
  overflow: hidden;
}

.card-poster-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform var(--transition);
}

.card-poster:hover .card-poster-img {
  transform: scale(1.03);
}

.card-poster-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(8,8,10,0.1) 0%, rgba(8,8,10,0.85) 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 10px;
}

.card-badge-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-poster-meta {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.card-title {
  font-size: var(--font-size-base);
  font-weight: 700;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-subinfo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--font-size-xs);
  color: var(--text-dim);
  font-family: var(--font-mono);
}

/* Horizontal Episode Card */
.card-episode {
  display: flex;
  gap: 14px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: 10px;
  text-decoration: none;
  color: inherit;
  transition: background var(--transition-fast), border-color var(--transition-fast);
}

.card-episode:hover,
.card-episode.active {
  background: var(--bg-elevated);
  border-color: var(--border-hover);
}

.card-episode.active {
  border-left: 2px solid var(--accent-primary);
}

.card-episode-thumb {
  position: relative;
  width: 130px;
  aspect-ratio: 16 / 9;
  background: #14141c;
  flex-shrink: 0;
  border-radius: var(--radius-xs);
  overflow: hidden;
}

.card-episode-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-episode-duration {
  position: absolute;
  bottom: 4px;
  right: 4px;
  background: rgba(0, 0, 0, 0.75);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 4px;
  border-radius: var(--radius-xs);
  color: #ffffff;
}

.card-episode-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  overflow: hidden;
}

.card-episode-num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent-primary);
  font-weight: 600;
}

.card-episode-title {
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-episode-desc {
  font-size: var(--font-size-xs);
  color: var(--text-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Progress bar inside cards */
.progress-bar-wrap {
  width: 100%;
  height: 3px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-xs);
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent-primary);
}


/* ==========================================================================
   5. NAVIGATION & HEADER PILLS
   ========================================================================== */

.site-header {
  width: 100%;
  height: var(--header-height);
  background: #09090c;
  border-bottom: 1px solid var(--border-subtle);
  position: sticky;
  top: 0;
  left: 0;
  z-index: 1000;
}

.header-inner {
  max-width: var(--container-max);
  height: 100%;
  margin: 0 auto;
  padding: 0 var(--space-6);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 32px;
}

/* Brand Logo */
.brand-logo-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text-main);
}

.brand-mark-square {
  width: 26px;
  height: 26px;
  background: #000000;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  transition: border-color var(--transition-fast);
}

.brand-logo-wrap:hover .brand-mark-square {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.brand-name {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.2px;
  text-transform: uppercase;
  font-family: var(--font-mono);
  display: flex;
  align-items: center;
  gap: 4px;
}

.brand-name .brand-dot {
  color: var(--accent-primary);
}

.brand-slogan {
  font-size: 9.5px;
  color: var(--text-dim);
  font-weight: 500;
  letter-spacing: 0.3px;
  text-transform: lowercase;
}

/* Site Navigation */
.site-nav {
  display: flex;
  align-items: center;
  gap: 16px;
}

.site-nav a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  padding: 5px 8px;
  border-radius: var(--radius);
  transition: color var(--transition-fast), background var(--transition-fast);
}

.site-nav a:hover,
.site-nav a.active {
  color: #ffffff;
}

.site-nav a.active {
  background: rgba(255, 255, 255, 0.06);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

/* User Account Pill */
.user-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 8px 3px 4px;
  background: var(--bg-surface);
  border: 1px solid var(--border-main);
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--text-main);
  font-size: var(--font-size-xs);
  cursor: pointer;
  transition: border-color var(--transition-fast);
}

.user-pill:hover {
  border-color: var(--border-hover);
}

.user-avatar {
  width: 22px;
  height: 22px;
  border-radius: var(--radius-xs);
  background: #2563eb;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
}

/* Segmented Control Tabs */
.tabs-segmented {
  display: inline-flex;
  background: var(--bg-surface);
  border: 1px solid var(--border-main);
  border-radius: var(--radius);
  padding: 3px;
  gap: 2px;
}

.tab-item {
  padding: 5px 12px;
  font-size: var(--font-size-xs);
  font-weight: 500;
  color: var(--text-muted);
  border-radius: var(--radius-xs);
  text-decoration: none;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.tab-item:hover {
  color: #ffffff;
}

.tab-item.active {
  background: var(--bg-elevated);
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}

/* Breadcrumbs */
.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--font-size-xs);
  color: var(--text-dim);
}

.breadcrumbs a {
  color: var(--text-muted);
  text-decoration: none;
}

.breadcrumbs a:hover {
  color: #ffffff;
}

.breadcrumbs .separator {
  color: var(--text-dim);
}


/* ==========================================================================
   6. PLAYER HUD & TELEMETRY
   ========================================================================== */

.player-viewport {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000000;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: var(--radius);
  border: 1px solid var(--border-subtle);
}

.player-overlay-hud {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 20px;
  background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.85) 100%);
  pointer-events: auto;
}

.player-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.player-title-display {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.player-title-main {
  font-size: var(--font-size-lg);
  font-weight: 700;
  color: #ffffff;
}

.player-title-sub {
  font-size: var(--font-size-xs);
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.player-bottom-controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Scrubber Timeline */
.scrubber-bar-container {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 3px;
  position: relative;
  cursor: pointer;
  transition: height var(--transition-fast);
}

.scrubber-bar-container:hover {
  height: 8px;
}

.scrubber-buffered {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  background: rgba(255, 255, 255, 0.35);
  border-radius: 3px;
}

.scrubber-played {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  background: var(--accent-primary);
  border-radius: 3px;
}

.scrubber-handle {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 4px rgba(0,0,0,0.8);
}

.player-control-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.player-controls-left,
.player-controls-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.timecode-label {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: #ffffff;
}

/* Telemetry Diagnostics Overlay Box */
.telemetry-card {
  background: rgba(10, 10, 14, 0.92);
  border: 1px solid var(--border-main);
  border-radius: var(--radius);
  padding: 12px 16px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  backdrop-filter: blur(8px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.telemetry-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.telemetry-item .label {
  font-size: 9.5px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.telemetry-item .value {
  color: #ffffff;
  font-weight: 600;
}


/* ==========================================================================
   7. MODALS, TOASTS & OVERLAYS
   ========================================================================== */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  padding: 20px;
}

.modal-window {
  width: 100%;
  max-width: 480px;
  background: var(--bg-elevated);

  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: var(--font-size-md);
  font-weight: 700;
  color: var(--text-main);
}

.modal-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.modal-footer {
  padding: 14px 20px;
  background: rgba(0, 0, 0, 0.25);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
}

/* Toast Notification */
.toast-notification {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-main);
  border-left: 3px solid var(--accent-primary);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  color: var(--text-main);
  font-size: var(--font-size-sm);
}

.toast-notification.success {
  border-left-color: var(--status-live);
}

.toast-notification.warning {
  border-left-color: var(--status-warning);
}

.toast-notification.danger {
  border-left-color: var(--status-danger);
}
